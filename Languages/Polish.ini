LanmanBuf=Przyspiesz udostępnianie i dostęp do plików w sieci lokalnej.
NetworkThrottlingIndex=Usuń limity prędkości sieci dla multimediów i gier.
OptLAN=Zoptymalizuj ustawienia sieci lokalnej, aby uzyskać szybszy transfer danych.
OptDNS=Przyspiesz wyszukiwanie adresów internetowych, aby szybciej ładować strony.
OptEthernet=Dostosuj wydajność przewodowej karty sieciowej.
OptNetForward=Zwiększyć efektywność kierowania ruchem danych w sieci.
OptNetWork=Zoptymalizuj podstawowe ustawienia sieci, aby zwiększyć prędkość transferu.
OptWINS=Przyspieszenie rozwiązywania nazw w starszych sieciach lokalnych.
OptMTU=Automatycznie wykryj najlepszy rozmiar pakietu, aby zapobiec utracie danych.
OptTTL=Zmodyfikuj ustawienia Time-to-Live (TTL), aby skrócić czas wygaśnięcia pakietów.
OptIEConnection=Zoptymalizuj połączenia z serwerami, aby strony internetowe i filmy w sieci ładowały się szybciej.

SSDSpeedup=Optymalizacja SSD
DisableHibernate=Wyłącz hibernację, aby odzyskać miejsce na dysku i zmniejszyć zużycie dysku SSD ("szybkie uruchamianie" również zostanie wyłączone).
DisableDefragBoot=Zatrzymaj defragmentację podczas uruchamianiu systemu, aby wydłużyć żywotność dysku SSD.
DisableDefragIdle=Wyłącz automatyczną defragmentację w trybie bezczynności, aby zapobiec niepotrzebnemu zużyciu dysku SSD.
DisablePrefetch=Wyłącz Prefetch, aby zmniejszyć liczbę operacji zapisu w tle na dysku SSD.
EnableTRIM=Włącz TRIM, aby utrzymać maksymalną szybkość i wydajność dysku SSD.
DisableSuperPrefetch=Wyłącz Superfetch, aby zminimalizować aktywność dysku SSD i wydłużyć jego żywotność.

Systemsecurity=Bezpieczeństwo systemu
WMPNetworkSvc=Wyłącz udostępnianie w Media Player, aby chronić swoją prywatność.
DataCollection=Wyłącz telemetrię, aby zatrzymać wysyłanie danych diagnostycznych do Microsoft i zwiększyć swoją prywatność.
StickyKeys=Wyłącz klawisze trwałe (pięciokrotne naciśnięcie Shift), aby zapobiec przypadkowej aktywacji.
LockScreenToastEnabled=Ukryj powiadomienia na ekranie blokady, aby chronić swoją prywatność.
DownloadMode=Wyłącz optymalizację dostarczania aktualizacji Windows, aby zatrzymać udostępnianie aktualizacji innym komputerom i oszczędzać przepustowość łącza.
RemoteGetHelp=Wyłącz pomoc zdalną, aby zapobiec nieautoryzowanemu dostępowi i zwiększyć bezpieczeństwo komputera.

